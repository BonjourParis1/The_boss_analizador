[theme]
base = "light"
primaryColor = "#5aa017"
backgroundColor = "#dff0ab"
secondaryBackgroundColor = "#ffffff"
textColor = "#16261b"
font = "sans serif"

[server]
headless = true
runOnSave = false
# Seguridad: por defecto el panel solo es accesible desde TU equipo (localhost).
# Si quieres exponerlo en tu red local, cambia a "0.0.0.0" bajo tu propio riesgo.
address = "localhost"

[browser]
gatherUsageStats = false
