name: Motor autónomo (24/7)

# Ejecuta una pasada del motor cada 15 minutos: analiza el mercado, registra señales
# y evalúa resultados, guardando todo en Supabase. GRATIS e ilimitado si el repo es
# PÚBLICO; en repo privado consume minutos de GitHub Actions (2000/mes gratis).
on:
  schedule:
    - cron: "*/15 * * * *"     # cada 15 min (el mínimo de GitHub es 5; suele retrasarse)
  workflow_dispatch: {}         # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  group: motor-autonomo
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Una pasada del motor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-2.0-flash
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python worker_once.py
